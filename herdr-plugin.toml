id = "shadowfax.beacon"
name = "Beacon"
version = "0.1.0"
min_herdr_version = "0.7.5"
description = "Navigate unread requests, working or blocked turns, and other agents by recent activity."
platforms = ["macos", "linux"]

[[build]]
command = ["cargo", "build", "--release", "--locked"]

[[actions]]
id = "jump-unread"
title = "Jump to unread or blocked agent"
description = "Cycle through unread completions and blocked agents."
command = ["./target/release/herdr-beacon", "jump-unread"]

[[actions]]
id = "jump-working"
title = "Jump to working or blocked agent"
description = "Cycle through working or blocked agents."
command = ["./target/release/herdr-beacon", "jump-working"]

[[actions]]
id = "jump-recent"
title = "Jump to recently active agent"
description = "Cycle through idle, done, or unknown agents by recent activity."
command = ["./target/release/herdr-beacon", "jump-recent"]

[[actions]]
id = "jump-recent-reverse"
title = "Previous agent by recent activity"
description = "Step backward through idle, done, or unknown agents in activity order."
command = ["./target/release/herdr-beacon", "jump-recent-reverse"]

[[actions]]
id = "install-keybindings"
title = "Install Beacon keybindings"
description = "Bind Alt-U for unread/blocked, Alt-O for working/blocked, and Alt-' / Shift-Alt-' for other agents."
command = ["./target/release/herdr-beacon", "install-keybindings"]

[[events]]
on = "pane.agent_status_changed"
command = ["./target/release/herdr-beacon", "event"]

[[events]]
on = "pane.focused"
command = ["./target/release/herdr-beacon", "event"]

[[events]]
on = "pane.closed"
command = ["./target/release/herdr-beacon", "event"]

[[events]]
on = "pane.exited"
command = ["./target/release/herdr-beacon", "event"]

[[events]]
on = "pane.agent_detected"
command = ["./target/release/herdr-beacon", "event"]

[[events]]
on = "pane.moved"
command = ["./target/release/herdr-beacon", "event"]

[[events]]
on = "workspace.created"
command = ["./target/release/herdr-beacon", "event"]

[[events]]
on = "workspace.closed"
command = ["./target/release/herdr-beacon", "event"]

[[events]]
on = "workspace.renamed"
command = ["./target/release/herdr-beacon", "event"]
