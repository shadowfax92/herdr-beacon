[package]
name = "herdr-beacon"
version = "0.1.0"
edition = "2021"
description = "Unread agent navigation for Herdr"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
fs2 = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml_edit = "0.24"
uuid = { version = "1.22", features = ["v4"] }

[dev-dependencies]
tempfile = "3.23"

